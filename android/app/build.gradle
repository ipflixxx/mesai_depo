apply plugin: 'com.android.application'

def resolvedVersionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "10001").toInteger()
def resolvedVersionName = System.getenv("ANDROID_VERSION_NAME") ?: "1.0.1"

android {
    namespace = "com.mesai.app"
    compileSdk = rootProject.ext.compileSdkVersion

    buildFeatures {
        buildConfig = true
    }

    defaultConfig {
        applicationId "com.mesai.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
            def ksPass = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            def kAlias = System.getenv("ANDROID_KEY_ALIAS")
            def kPass = System.getenv("ANDROID_KEY_PASSWORD")
            if (ksPath != null && !ksPath.isEmpty()) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias kAlias
                keyPassword kPass
            }
        }
    }

    flavorDimensions += "distribution"
    productFlavors {
        play {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION_CHANNEL", '"play"'
        }
        direct {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION_CHANNEL", '"direct"'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def isReleaseTask = taskGraph.allTasks.any { task ->
        task.name.toLowerCase().contains("release") &&
        (task.name.toLowerCase().contains("assemble") || task.name.toLowerCase().contains("bundle") || task.name.toLowerCase().contains("package"))
    }
    if (isReleaseTask) {
        def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")
        def ksPass = System.getenv("ANDROID_KEYSTORE_PASSWORD")
        def kAlias = System.getenv("ANDROID_KEY_ALIAS")
        def kPass = System.getenv("ANDROID_KEY_PASSWORD")
        if (!ksPath || !file(ksPath).exists() || !ksPass || !kAlias || !kPass) {
            throw new GradleException(
                "Release signing configuration is incomplete. Ensure ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD are set."
            )
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation "com.google.android.play:app-update:2.1.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied.")
}
