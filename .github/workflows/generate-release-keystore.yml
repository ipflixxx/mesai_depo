name: Generate Permanent Android Release Keystore (One-Time)

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Keystore Key Alias'
        required: true
        default: 'mesai'
        type: string
      validity_days:
        description: 'Keystore geçerlilik süresi (gün)'
        required: true
        default: '10000'
        type: string
      common_name:
        description: 'Sertifika Ortak Adı (CN)'
        required: true
        default: 'MESAI Mobile'
        type: string
      organization:
        description: 'Kurum / Geliştirici Adı (O)'
        required: true
        default: 'MESAI'
        type: string
      country_code:
        description: 'Ülke Kodu (C)'
        required: true
        default: 'TR'
        type: string

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate Permanent Keystore & Base64 Bundle (Zero Log Exposure)
        id: gen
        shell: bash
        run: |
          set +x
          set -euo pipefail

          ALIAS=$(printf '%s' "${{ inputs.key_alias }}" | tr -cd 'A-Za-z0-9._-')
          VALIDITY=$(printf '%s' "${{ inputs.validity_days }}" | tr -cd '0-9')
          CN=$(printf '%s' "${{ inputs.common_name }}" | tr -d ',="\\')
          ORG=$(printf '%s' "${{ inputs.organization }}" | tr -d ',="\\')
          COUNTRY_CLEAN=$(printf '%s' "${{ inputs.country_code }}" | tr -cd 'A-Za-z' | tr '[:lower:]' '[:upper:]')
          COUNTRY="${COUNTRY_CLEAN:0:2}"

          if [ -z "$ALIAS" ] || [ -z "$VALIDITY" ]; then
            echo "Invalid alias or validity days."
            exit 1
          fi

          # Generate cryptographically strong random passwords via Python secrets (no pipe/SIGPIPE)
          STORE_PASS=$(python3 -c 'import secrets, string; a = string.ascii_letters + string.digits; print("".join(secrets.choice(a) for _ in range(28)))')
          KEY_PASS=$(python3 -c 'import secrets, string; a = string.ascii_letters + string.digits; print("".join(secrets.choice(a) for _ in range(28)))')

          # Mask sensitive values immediately so GitHub logs can never display them
          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"

          mkdir -p keystore-bundle
          KEYSTORE_FILE="keystore-bundle/mesai-release.jks"

          keytool -genkeypair -noprompt \
            -keystore "$KEYSTORE_FILE" \
            -storetype PKCS12 \
            -alias "$ALIAS" \
            -keyalg RSA \
            -keysize 4096 \
            -sigalg SHA256withRSA \
            -validity "$VALIDITY" \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=${CN}, OU=Mobile, O=${ORG}, C=${COUNTRY}" \
            > /dev/null 2>&1

          base64 -w 0 "$KEYSTORE_FILE" > keystore-bundle/ANDROID_KEYSTORE_BASE64.txt
          KEYSTORE_B64=$(cat keystore-bundle/ANDROID_KEYSTORE_BASE64.txt)
          echo "::add-mask::$KEYSTORE_B64"

          {
            echo "MESAİ ANDROID RELEASE SIGNING SECRETS"
            echo "======================================"
            echo "Bu dosyadaki değerleri private mesai_depo deposunda"
            echo "Settings > Secrets and variables > Actions bölümüne ekleyin,"
            echo "ardından bu dosyayı ve workflow artifact'ını güvenli biçimde saklayıp/silin."
            echo ""
            echo "ANDROID_KEY_ALIAS=${ALIAS}"
            echo "ANDROID_KEYSTORE_PASSWORD=${STORE_PASS}"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASS}"
            echo ""
            echo "ANDROID_KEYSTORE_BASE64 değeri ayrı dosyadadır: ANDROID_KEYSTORE_BASE64.txt"
          } > keystore-bundle/SECRETS_CREDENTIALS.txt

          # Extract ONLY public certificate fingerprints (safe for summary)
          keytool -list -v \
            -keystore "$KEYSTORE_FILE" \
            -storepass "$STORE_PASS" \
            -alias "$ALIAS" > cert-list.tmp
          grep -E "Alias name:|Creation date:|Valid from:|SHA1:|SHA256:" cert-list.tmp > keystore-bundle/PUBLIC_FINGERPRINTS.txt
          rm -f cert-list.tmp

          {
            echo "### MESAİ Kalıcı İmzalama Anahtarı Oluşturuldu"
            echo ""
            echo "Gizli anahtar ve parolalar güvenlik amacıyla loglara yazdırılmadı."
            echo "**Yalnızca herkese açık sertifika parmak izleri:**"
            echo '```'
            cat keystore-bundle/PUBLIC_FINGERPRINTS.txt
            echo '```'
            echo ""
            echo "1. Yukarıdaki **mesai-release-keystore-bundle** artifact dosyasını indirin (1 gün içinde otomatik silinir)."
            echo "2. \`mesai-release.jks\` dosyasını çevrimdışı güvenli yedekte saklayın."
            echo "3. \`SECRETS_CREDENTIALS.txt\` ve \`ANDROID_KEYSTORE_BASE64.txt\` içindeki değerleri GitHub Actions Secrets'e ekleyin."
            echo "4. Secret'ları ekledikten sonra bu workflow çalıştırmasını (ve artifact'ı) manuel olarak silin."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Keystore Bundle as Short-Lived Private Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesai-release-keystore-bundle
          path: keystore-bundle/
          retention-days: 1

      - name: Wipe Keystore Files From Runner Workspace
        if: always()
        shell: bash
        run: |
          rm -rf keystore-bundle
