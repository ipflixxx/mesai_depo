name: MESAİ Android Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Uygulama Sürümü (örn: 1.0.1)'
        required: true
        type: string
      version_code:
        description: 'Android versionCode (örn: 10001)'
        required: true
        type: string
      mandatory:
        description: 'Zorunlu güncelleme mi?'
        required: false
        default: false
        type: boolean
      min_supported_version_code:
        description: 'Minimum desteklenen versionCode (opsiyonel)'
        required: false
        default: '10000'
        type: string
      release_notes:
        description: 'Sürüm notları (her satır bir madde)'
        required: false
        default: 'Performans iyileştirmeleri ve hata düzeltmeleri.'
        type: string

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Pre-Flight Validate Required Signing & Release Secrets
        shell: bash
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
          HAS_PUSH_TOKEN: ${{ secrets.RELEASES_PUSH_TOKEN != '' }}
        run: |
          set +x
          MISSING=""
          [ "$HAS_KEYSTORE" != "true" ] && MISSING="$MISSING ANDROID_KEYSTORE_BASE64"
          [ "$HAS_STORE_PASS" != "true" ] && MISSING="$MISSING ANDROID_KEYSTORE_PASSWORD"
          [ "$HAS_ALIAS" != "true" ] && MISSING="$MISSING ANDROID_KEY_ALIAS"
          [ "$HAS_KEY_PASS" != "true" ] && MISSING="$MISSING ANDROID_KEY_PASSWORD"
          [ "$HAS_PUSH_TOKEN" != "true" ] && MISSING="$MISSING RELEASES_PUSH_TOKEN"

          if [ -n "$MISSING" ]; then
            echo "::error::Eksik GitHub Secrets:$MISSING. Derleme başlatılmadan durduruldu; önceki yayınlara dokunulmadı."
            exit 1
          fi
          echo "Tüm zorunlu imzalama ve yayın secret'ları doğrulandı."

      - name: Checkout private source repository (mesai_depo)
        uses: actions/checkout@v4

      - name: Resolve and validate version metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
            VERSION_CODE="${{ inputs.version_code }}"
            MANDATORY="${{ inputs.mandatory }}"
            MIN_CODE="${{ inputs.min_supported_version_code }}"
            NOTES="${{ inputs.release_notes }}"
          else
            TAG="${GITHUB_REF_NAME#v}"
            VERSION_NAME="$TAG"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${TAG%%-*}"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            MANDATORY="false"
            MIN_CODE="10000"
            NOTES=$(git log -1 --pretty=%B | tr '\r' ' ')
          fi

          if ! [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][A-Za-z0-9._-]+)?$ ]]; then
            echo "::error::Geçersiz version_name formatı: $VERSION_NAME"
            exit 1
          fi
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -le 0 ]; then
            echo "::error::Geçersiz version_code: $VERSION_CODE"
            exit 1
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "mandatory=$MANDATORY" >> "$GITHUB_OUTPUT"
          echo "min_code=$MIN_CODE" >> "$GITHUB_OUTPUT"
          {
            echo 'release_notes<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm ci

      - name: Run TypeScript code check
        run: npm run lint

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode & Verify Permanent Android Release Keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set +x
          set -uo pipefail
          KEYSTORE_PATH="${{ github.workspace }}/android/app/release.keystore"

          # 1. Base64 cozumleme kontrolu
          if printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$KEYSTORE_PATH" 2>/dev/null && [ -s "$KEYSTORE_PATH" ]; then
            chmod 600 "$KEYSTORE_PATH"
            echo "KONTROL_BASE64_COZME: BASARILI"
          else
            echo "KONTROL_BASE64_COZME: BASARISIZ"
            exit 1
          fi

          # 2. Keystore acilisi ve alias kontrolu (keytool)
          if keytool -list -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" > /dev/null 2>&1; then
            echo "KONTROL_KEYSTORE_VE_ALIAS: BASARILI"
          else
            echo "KONTROL_KEYSTORE_VE_ALIAS: BASARISIZ"
            exit 1
          fi

          # 3. Ozel anahtarin ANDROID_KEY_PASSWORD ile acilisi (Gradle ile ayni Java KeyStore API)
          cat << 'EOF' > /tmp/VerifyKeystoreKey.java
          import java.io.File;
          import java.security.Key;
          import java.security.KeyStore;
          import java.security.PrivateKey;

          public class VerifyKeystoreKey {
              public static void main(String[] args) {
                  String ksPath = System.getenv("KEYSTORE_PATH_CHECK");
                  String storePass = System.getenv("ANDROID_KEYSTORE_PASSWORD");
                  String alias = System.getenv("ANDROID_KEY_ALIAS");
                  String keyPass = System.getenv("ANDROID_KEY_PASSWORD");

                  try {
                      KeyStore ks = KeyStore.getInstance(new File(ksPath), storePass.toCharArray());
                      if (!ks.containsAlias(alias) || !ks.isKeyEntry(alias)) {
                          System.out.println("KONTROL_ALIAS_ANAHTAR_GIRIS: BASARISIZ");
                          System.exit(1);
                      }
                      System.out.println("KONTROL_ALIAS_ANAHTAR_GIRIS: BASARILI");

                      try {
                          Key key = ks.getKey(alias, keyPass.toCharArray());
                          if (key instanceof PrivateKey) {
                              System.out.println("KONTROL_OZEL_ANAHTAR_ANDROID_KEY_PASSWORD: BASARILI");
                              System.exit(0);
                          }
                          System.out.println("KONTROL_OZEL_ANAHTAR_ANDROID_KEY_PASSWORD: BASARISIZ");
                          System.exit(1);
                      } catch (Exception keyErr) {
                          System.out.println("KONTROL_OZEL_ANAHTAR_ANDROID_KEY_PASSWORD: BASARISIZ");
                          try {
                              Key fallbackKey = ks.getKey(alias, storePass.toCharArray());
                              if (fallbackKey instanceof PrivateKey) {
                                  System.out.println("TESHIS_PKCS12_PAROLA_UYUMU: BASARISIZ (Keystore PKCS12 formatinda oldugu icin ozel anahtar ANDROID_KEYSTORE_PASSWORD ile sifrelenmis; ANDROID_KEY_PASSWORD secret degeri ANDROID_KEYSTORE_PASSWORD ile ayni olmalidir)");
                              }
                          } catch (Exception ignored) {
                              // No secret output
                          }
                          System.exit(1);
                      }
                  } catch (Exception e) {
                      System.out.println("KONTROL_KEYSTORE_YUKLEME: BASARISIZ");
                      System.exit(1);
                  }
              }
          }
          EOF

          KEYSTORE_PATH_CHECK="$KEYSTORE_PATH" java /tmp/VerifyKeystoreKey.java
          CHECK_EXIT=$?
          rm -f /tmp/VerifyKeystoreKey.java
          if [ "$CHECK_EXIT" -ne 0 ]; then
            exit "$CHECK_EXIT"
          fi

      - name: Build Direct Web Assets & Signed Direct Release APK
        env:
          ANDROID_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          VITE_DISTRIBUTION_CHANNEL: direct
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDirectRelease --no-daemon

      - name: Build Play Web Assets & Signed Google Play AAB
        env:
          ANDROID_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          VITE_DISTRIBUTION_CHANNEL: play
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npm run build
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew bundlePlayRelease --no-daemon

      - name: Verify APK & AAB Signatures and Identical Signing Certificate
        shell: bash
        run: |
          set +x
          set -euo pipefail
          APK_SRC=$(find android/app/build/outputs/apk/direct/release -name "*.apk" ! -name "*-unsigned.apk" -print -quit)
          AAB_SRC=$(find android/app/build/outputs/bundle/playRelease -name "*.aab" -print -quit)

          if [ -z "$APK_SRC" ] || [ -z "$AAB_SRC" ]; then
            echo "::error::İmzalı Direct APK veya Play AAB çıktısı bulunamadı."
            exit 1
          fi

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name "apksigner" \( -type f -o -type l \) | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android build-tools apksigner bulunamadı."
            exit 1
          fi

          AAPT2=$(find "$ANDROID_HOME/build-tools" -name "aapt2" \( -type f -o -type l \) | sort -V | tail -n 1 || true)
          if [ -n "$AAPT2" ]; then
            BADGING=$("$AAPT2" dump badging "$APK_SRC" | head -n 1)
            if ! printf '%s' "$BADGING" | grep -q "name='com.mesai.app'"; then
              echo "::error::APK paket kimliği com.mesai.app değil: $BADGING"
              exit 1
            fi
            echo "APK Paket Doğrulaması: $BADGING"
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK_SRC" > apk-certs.txt

          if ! LC_ALL=C jarsigner -verify "$AAB_SRC" > aab-verify.txt 2>&1; then
            echo "::error::Play AAB jarsigner doğrulaması başarısız!"
            cat aab-verify.txt
            exit 1
          fi

          if ! grep -qi "jar verified" aab-verify.txt || grep -qi "jar is unsigned" aab-verify.txt; then
            echo "::error::Play AAB imzalı değil veya doğrulanamadı!"
            cat aab-verify.txt
            exit 1
          fi

          LC_ALL=C keytool -printcert -jarfile "$AAB_SRC" > aab-certs.txt

          node -e '
            const fs = require("fs");
            const apkText = fs.readFileSync("apk-certs.txt", "utf8");
            const aabText = fs.readFileSync("aab-certs.txt", "utf8");

            const extractAllSha256 = (text) => {
              const matches = [...text.matchAll(/SHA-?256(?:\s+digest)?\s*:\s*([0-9a-fA-F:]{64,95})/gi)];
              return matches
                .map((m) => m[1].replace(/:/g, "").toLowerCase())
                .filter((h) => /^[0-9a-f]{64}$/.test(h));
            };

            const apkDigests = extractAllSha256(apkText);
            const aabDigests = extractAllSha256(aabText);

            if (apkDigests.length === 0) {
              throw new Error("APK SHA-256 sertifika parmak izi okunamadi.");
            }
            if (aabDigests.length === 0) {
              throw new Error("AAB SHA-256 sertifika parmak izi okunamadi.");
            }

            const apkSha = apkDigests[0];
            const aabSha = aabDigests[0];
            if (apkSha !== aabSha) {
              throw new Error(`APK (${apkSha}) ve AAB (${aabSha}) sertifikalari eslesmiyor!`);
            }
            console.log("APK ve AAB ayni kalici sertifika ile imzalandi (SHA-256: " + apkSha + ").");
          '

          rm -f apk-certs.txt aab-certs.txt aab-verify.txt

      - name: Prepare Direct APK & Generate Validated latest.json Manifest
        id: pkg
        shell: bash
        env:
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          MANDATORY: ${{ steps.meta.outputs.mandatory }}
          MIN_CODE: ${{ steps.meta.outputs.min_code }}
          RELEASE_NOTES: ${{ steps.meta.outputs.release_notes }}
        run: |
          set -euo pipefail
          mkdir -p release-out
          APK_SRC=$(find android/app/build/outputs/apk/direct/release -name "*.apk" ! -name "*-unsigned.apk" -print -quit)
          if [ -z "$APK_SRC" ]; then
            echo "::error::İmzalı Direct Release APK bulunamadı."
            exit 1
          fi
          APK_NAME="mesai-v${VERSION_NAME}-direct-release.apk"
          cp "$APK_SRC" "release-out/${APK_NAME}"

          export SHA256=$(sha256sum "release-out/${APK_NAME}" | awk '{print $1}')
          export SIZE_BYTES=$(stat -c%s "release-out/${APK_NAME}")
          export PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export APK_URL="https://github.com/ipflixxx/mesai_releases/releases/download/v${VERSION_NAME}/${APK_NAME}"

          echo "${SHA256}  ${APK_NAME}" > "release-out/${APK_NAME}.sha256"

          node -e '
            const fs = require("fs");
            const notes = (process.env.RELEASE_NOTES || "")
              .split(/\r?\n/)
              .map((s) => s.replace(/^[-*•]\s*/, "").trim())
              .filter(Boolean);
            const manifest = {
              appId: "com.mesai.app",
              versionName: process.env.VERSION_NAME,
              versionCode: Number(process.env.VERSION_CODE),
              minSupportedVersionCode: Number(process.env.MIN_CODE || 10000),
              mandatory: process.env.MANDATORY === "true",
              publishedAt: process.env.PUBLISHED_AT,
              apkUrl: process.env.APK_URL,
              sha256: process.env.SHA256,
              sizeBytes: Number(process.env.SIZE_BYTES),
              releaseNotes: notes.length ? notes : ["Performans iyileştirmeleri ve hata düzeltmeleri."]
            };
            if (!/^[a-f0-9]{64}$/.test(manifest.sha256) || manifest.sizeBytes <= 0) {
              throw new Error("Manifest validation failed");
            }
            fs.writeFileSync("release-out/latest.json", JSON.stringify(manifest, null, 2) + "\n");
          '

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          cat release-out/latest.json

      - name: Upload Play Store Signed AAB to Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mesai-v${{ steps.meta.outputs.version_name }}-play-aab
          path: android/app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload Direct Signed APK & Manifest to Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mesai-v${{ steps.meta.outputs.version_name }}-direct-apk
          path: |
            release-out/*.apk
            release-out/*.sha256
            release-out/latest.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish Direct APK & latest.json Atomically to ipflixxx/mesai_releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PUSH_TOKEN }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          APK_NAME: ${{ steps.pkg.outputs.apk_name }}
        run: |
          set +x
          set -euo pipefail

          node -e '
            const fs = require("fs");
            const path = require("path");

            const token = (process.env.GH_TOKEN || "").trim();
            const owner = "ipflixxx";
            const repo = "mesai_releases";
            const versionName = process.env.VERSION_NAME;
            const tag = `v${versionName}`;
            const apkName = process.env.APK_NAME;
            const shaName = `${apkName}.sha256`;

            if (!token) {
              throw new Error("RELEASES_PUSH_TOKEN eksik.");
            }

            const manifest = JSON.parse(fs.readFileSync("release-out/latest.json", "utf8"));
            const releaseNotes = (manifest.releaseNotes || []).map((n) => `- ${n}`).join("\n");
            const apiBase = `https://api.github.com/repos/${owner}/${repo}`;
            const transientStatuses = new Set([500, 502, 503, 504]);
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            function sanitizeApiBody(rawText) {
              if (!rawText) return "";
              try {
                const parsed = JSON.parse(rawText);
                const summary = {
                  message: parsed.message,
                  errors: parsed.errors,
                  documentation_url: parsed.documentation_url,
                };
                return JSON.stringify(summary);
              } catch {
                return rawText.slice(0, 500).replace(/[\r\n]+/g, " ");
              }
            }

            async function apiRequest(url, options = {}, retryLabel = "GitHub API") {
              const maxAttempts = 5;
              for (let attempt = 1; attempt <= maxAttempts; attempt++) {
                let res;
                let text = "";
                try {
                  res = await fetch(url, {
                    ...options,
                    headers: {
                      "Accept": "application/vnd.github+json",
                      "Authorization": `Bearer ${token}`,
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "mesai-android-release-pipeline",
                      ...(options.headers || {}),
                    },
                  });
                  text = await res.text();
                } catch (netErr) {
                  console.error(`[${retryLabel}] Ağ hatası (deneme ${attempt}/${maxAttempts}): ${netErr.message}`);
                  if (attempt === maxAttempts) throw netErr;
                  await sleep(5000 * attempt);
                  continue;
                }

                const reqId = res.headers.get("x-github-request-id") || "-";
                if (transientStatuses.has(res.status)) {
                  console.error(
                    `[${retryLabel}] Geçici HTTP ${res.status} (request-id: ${reqId}, deneme ${attempt}/${maxAttempts}): ${sanitizeApiBody(text)}`
                  );
                  if (attempt === maxAttempts) {
                    const err = new Error(`${retryLabel} kalıcı HTTP ${res.status} hatası verdi: ${sanitizeApiBody(text)}`);
                    err.status = res.status;
                    throw err;
                  }
                  await sleep(5000 * Math.pow(2, attempt - 1));
                  continue;
                }

                let json = null;
                try {
                  json = text ? JSON.parse(text) : null;
                } catch {
                  json = null;
                }
                return { status: res.status, reqId, text, json };
              }
            }

            async function findExistingRelease() {
              const byTag = await apiRequest(
                `${apiBase}/releases/tags/${encodeURIComponent(tag)}`,
                { method: "GET" },
                `Release kontrol (${tag})`
              );
              if (byTag.status === 200 && byTag.json) {
                return byTag.json;
              }
              if (byTag.status !== 404) {
                throw new Error(
                  `Mevcut release kontrolü başarısız (HTTP ${byTag.status}, request-id: ${byTag.reqId}): ${sanitizeApiBody(byTag.text)}`
                );
              }

              // Also check draft releases for the same tag
              const listRes = await apiRequest(
                `${apiBase}/releases?per_page=30`,
                { method: "GET" },
                "Release listesi kontrolü"
              );
              if (listRes.status === 200 && Array.isArray(listRes.json)) {
                const draftMatch = listRes.json.find((r) => r && r.tag_name === tag);
                if (draftMatch) return draftMatch;
              }
              return null;
            }

            async function ensureRelease() {
              const existing = await findExistingRelease();
              if (existing) {
                console.log(`Mevcut release bulundu (id: ${existing.id}, tag: ${tag}); yeniden oluşturulmayacak.`);
                return existing;
              }

              const repoRes = await apiRequest(apiBase, { method: "GET" }, "Hedef depo kontrolü");
              if (repoRes.status !== 200 || !repoRes.json) {
                throw new Error(
                  `Hedef depo okunamadı (HTTP ${repoRes.status}, request-id: ${repoRes.reqId}): ${sanitizeApiBody(repoRes.text)}`
                );
              }
              const defaultBranch = repoRes.json.default_branch || "main";
              const branchRes = await apiRequest(
                `${apiBase}/git/ref/heads/${encodeURIComponent(defaultBranch)}`,
                { method: "GET" },
                `Dal kontrolü (${defaultBranch})`
              );
              if (branchRes.status === 404) {
                throw new Error(
                  `Hedef depo (${owner}/${repo}) henüz başlangıç commit içermiyor (${defaultBranch} dalı yok). Release oluşturmadan önce ${defaultBranch} dalında en az bir başlangıç commit bulunmalıdır.`
                );
              }

              const payload = {
                tag_name: tag,
                target_commitish: defaultBranch,
                name: `MESAİ ${tag}`,
                body: releaseNotes,
                draft: false,
                prerelease: false,
              };

              const maxCreateAttempts = 4;
              for (let attempt = 1; attempt <= maxCreateAttempts; attempt++) {
                // Re-check before each attempt so we never recreate an already created release
                const recheck = await findExistingRelease();
                if (recheck) {
                  console.log(`Release zaten mevcut (id: ${recheck.id}, tag: ${tag}); mevcut release kullanılıyor.`);
                  return recheck;
                }

                let res;
                let text = "";
                try {
                  res = await fetch(`${apiBase}/releases`, {
                    method: "POST",
                    headers: {
                      "Accept": "application/vnd.github+json",
                      "Authorization": `Bearer ${token}`,
                      "Content-Type": "application/json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "mesai-android-release-pipeline",
                    },
                    body: JSON.stringify(payload),
                  });
                  text = await res.text();
                } catch (netErr) {
                  console.error(`[Release oluşturma] Ağ hatası (deneme ${attempt}/${maxCreateAttempts}): ${netErr.message}`);
                  if (attempt === maxCreateAttempts) throw netErr;
                  await sleep(5000 * attempt);
                  continue;
                }

                const reqId = res.headers.get("x-github-request-id") || "-";
                if (res.status === 201) {
                  const created = JSON.parse(text);
                  console.log(`Yeni GitHub Release oluşturuldu (id: ${created.id}, tag: ${tag}).`);
                  return created;
                }

                if (res.status === 422) {
                  console.warn(`[Release oluşturma] HTTP 422 alındı (request-id: ${reqId}): ${sanitizeApiBody(text)}`);
                  const after422 = await findExistingRelease();
                  if (after422) {
                    console.log(`Mevcut release bulundu ve kullanılıyor (id: ${after422.id}).`);
                    return after422;
                  }
                  throw new Error(`Release oluşturulamadı (HTTP 422, request-id: ${reqId}): ${sanitizeApiBody(text)}`);
                }

                if (transientStatuses.has(res.status)) {
                  console.error(
                    `[Release oluşturma] Geçici HTTP ${res.status} (request-id: ${reqId}, deneme ${attempt}/${maxCreateAttempts}): ${sanitizeApiBody(text)}`
                  );
                  if (attempt === maxCreateAttempts) {
                    throw new Error(
                      `GitHub Release API geçici sunucu hatası devam ediyor (HTTP ${res.status}, request-id: ${reqId}): ${sanitizeApiBody(text)}`
                    );
                  }
                  await sleep(5000 * Math.pow(2, attempt - 1));
                  continue;
                }

                throw new Error(
                  `Release oluşturma başarısız (HTTP ${res.status}, request-id: ${reqId}): ${sanitizeApiBody(text)}`
                );
              }
            }

            async function uploadAsset(release, filePath, contentType) {
              const fileName = path.basename(filePath);
              const fileBuffer = fs.readFileSync(filePath);
              const uploadBase = release.upload_url.replace(/\{[^}]*\}$/, "");

              const maxUploadAttempts = 4;
              for (let attempt = 1; attempt <= maxUploadAttempts; attempt++) {
                // Remove existing or partial asset with the same name before uploading
                const latestReleaseRes = await apiRequest(
                  `${apiBase}/releases/${release.id}`,
                  { method: "GET" },
                  `Asset kontrol (${fileName})`
                );
                if (latestReleaseRes.status === 200 && latestReleaseRes.json) {
                  const oldAsset = (latestReleaseRes.json.assets || []).find((a) => a.name === fileName);
                  if (oldAsset) {
                    const delRes = await apiRequest(
                      `${apiBase}/releases/assets/${oldAsset.id}`,
                      { method: "DELETE" },
                      `Eski asset temizleme (${fileName})`
                    );
                    if (delRes.status !== 204 && delRes.status !== 404) {
                      throw new Error(`Eski asset silinemedi (${fileName}, HTTP ${delRes.status})`);
                    }
                  }
                }

                const uploadRes = await apiRequest(
                  `${uploadBase}?name=${encodeURIComponent(fileName)}`,
                  {
                    method: "POST",
                    headers: {
                      "Content-Type": contentType,
                      "Content-Length": String(fileBuffer.length),
                    },
                    body: fileBuffer,
                  },
                  `Asset yükleme (${fileName})`
                );

                if (uploadRes.status === 201 && uploadRes.json && uploadRes.json.state === "uploaded") {
                  console.log(`Release asset yüklendi: ${fileName} (${uploadRes.json.size} byte)`);
                  return uploadRes.json;
                }

                console.error(
                  `[Asset yükleme (${fileName})] HTTP ${uploadRes.status} (request-id: ${uploadRes.reqId}, deneme ${attempt}/${maxUploadAttempts}): ${sanitizeApiBody(uploadRes.text)}`
                );
                if (attempt === maxUploadAttempts) {
                  throw new Error(`Asset yüklenemedi: ${fileName} (HTTP ${uploadRes.status})`);
                }
                await sleep(5000 * attempt);
              }
            }

            (async () => {
              const release = await ensureRelease();
              await uploadAsset(release, `release-out/${apkName}`, "application/vnd.android.package-archive");
              await uploadAsset(release, `release-out/${shaName}`, "text/plain; charset=utf-8");

              const verifyRes = await apiRequest(
                `${apiBase}/releases/${release.id}`,
                { method: "GET" },
                "Release asset doğrulama"
              );
              if (verifyRes.status !== 200 || !verifyRes.json) {
                throw new Error(`Release doğrulaması başarısız (HTTP ${verifyRes.status}).`);
              }
              const uploadedApk = (verifyRes.json.assets || []).find(
                (a) => a.name === apkName && a.state === "uploaded" && Number(a.size) === Number(manifest.sizeBytes)
              );
              if (!uploadedApk) {
                throw new Error("Yüklenen APK asset boyut veya durum doğrulamasından geçemedi!");
              }
              console.log(`Release ve APK asset doğrulandı: ${apkName}`);
            })().catch((err) => {
              console.error(`::error::Release yayınlama başarısız (APK ve AAB Build Artifacts olarak yüklendi): ${err.message}`);
              process.exit(1);
            });
          '

          # Update latest.json on main branch only after APK release and asset upload are verified
          ASKPASS_SCRIPT=$(mktemp)
          chmod 700 "$ASKPASS_SCRIPT"
          cat << 'EOF' > "$ASKPASS_SCRIPT"
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' "x-access-token" ;;
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
          esac
          EOF
          trap 'rm -f "$ASKPASS_SCRIPT"' EXIT

          export GIT_ASKPASS="$ASKPASS_SCRIPT"
          export GIT_TERMINAL_PROMPT=0
          git clone --branch main --single-branch "https://github.com/ipflixxx/mesai_releases.git" releases-repo
          cp release-out/latest.json releases-repo/latest.json
          cd releases-repo
          git config user.name "mesai-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): publish v${VERSION_NAME}"
            git push origin main
          fi

      - name: Securely Cleanup Keystore & Temp Files
        if: always()
        shell: bash
        run: |
          rm -f "${{ github.workspace }}/android/app/release.keystore"
          rm -rf release-out releases-repo apk-certs.txt aab-certs.txt aab-verify.txt
