name: MESAİ Android Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Uygulama Sürümü (örn: 1.0.1)'
        required: true
        type: string
      version_code:
        description: 'Android versionCode (örn: 10001)'
        required: true
        type: string
      mandatory:
        description: 'Zorunlu güncelleme mi?'
        required: false
        default: false
        type: boolean
      min_supported_version_code:
        description: 'Minimum desteklenen versionCode (opsiyonel)'
        required: false
        default: '10000'
        type: string
      release_notes:
        description: 'Sürüm notları (her satır bir madde)'
        required: false
        default: 'Performans iyileştirmeleri ve hata düzeltmeleri.'
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout private source repository (mesai_depo)
        uses: actions/checkout@v4

      - name: Resolve version metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION_NAME="${{ inputs.version_name }}"
            VERSION_CODE="${{ inputs.version_code }}"
            MANDATORY="${{ inputs.mandatory }}"
            MIN_CODE="${{ inputs.min_supported_version_code }}"
            NOTES="${{ inputs.release_notes }}"
          else
            TAG="${GITHUB_REF_NAME#v}"
            VERSION_NAME="$TAG"
            IFS='.' read -r MAJOR MINOR PATCH <<< "${TAG%%-*}"
            MAJOR=${MAJOR:-1}
            MINOR=${MINOR:-0}
            PATCH=${PATCH:-0}
            VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
            MANDATORY="false"
            MIN_CODE="10000"
            NOTES=$(git log -1 --pretty=%B | tr '\r' ' ')
          fi

          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "mandatory=$MANDATORY" >> "$GITHUB_OUTPUT"
          echo "min_code=$MIN_CODE" >> "$GITHUB_OUTPUT"
          {
            echo 'release_notes<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Direct Web Assets & Sync Capacitor Android
        env:
          ANDROID_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          VITE_DISTRIBUTION_CHANNEL: direct
        run: |
          npm run build
          npx cap sync android

      - name: Decode Android Keystore (if configured)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          else
            echo "WARNING: ANDROID_KEYSTORE_BASE64 secret not set; generating ephemeral CI signing key for dry run."
            keytool -genkeypair -v -keystore android/app/release.keystore \
              -alias mesai -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'change-me-store' }}" \
              -keypass "${{ secrets.ANDROID_KEY_PASSWORD || 'change-me-key' }}" \
              -dname "CN=MESAI, OU=Mobile, O=MESAI, L=Istanbul, C=TR"
          fi

      - name: Build Signed Direct Release APK
        env:
          ANDROID_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'change-me-store' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'mesai' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'change-me-key' }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDirectRelease --no-daemon

      - name: Build Google Play Assets & Signed AAB
        env:
          ANDROID_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          ANDROID_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          VITE_DISTRIBUTION_CHANNEL: play
          ANDROID_KEYSTORE_PATH: release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'change-me-store' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'mesai' }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || 'change-me-key' }}
        run: |
          npm run build
          npx cap sync android
          cd android
          ./gradlew bundlePlayRelease --no-daemon

      - name: Prepare APK Artifact & Generate latest.json Manifest
        id: pkg
        shell: bash
        env:
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          MANDATORY: ${{ steps.meta.outputs.mandatory }}
          MIN_CODE: ${{ steps.meta.outputs.min_code }}
          RELEASE_NOTES: ${{ steps.meta.outputs.release_notes }}
        run: |
          mkdir -p release-out
          APK_SRC=$(find android/app/build/outputs/apk/direct/release -name "*.apk" | head -n 1)
          if [ -z "$APK_SRC" ]; then
            echo "Direct APK output not found!"
            exit 1
          fi

          APK_NAME="mesai-v${VERSION_NAME}-direct-release.apk"
          cp "$APK_SRC" "release-out/${APK_NAME}"

          SHA256=$(sha256sum "release-out/${APK_NAME}" | awk '{print $1}')
          SIZE_BYTES=$(stat -c%s "release-out/${APK_NAME}")
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          APK_URL="https://github.com/ipflixxx/mesai_releases/releases/download/v${VERSION_NAME}/${APK_NAME}"

          echo "${SHA256}  ${APK_NAME}" > "release-out/${APK_NAME}.sha256"

          node -e '
            const fs = require("fs");
            const notes = (process.env.RELEASE_NOTES || "")
              .split(/\r?\n/)
              .map((s) => s.replace(/^[-*•]\s*/, "").trim())
              .filter(Boolean);
            const manifest = {
              appId: "com.mesai.app",
              versionName: process.env.VERSION_NAME,
              versionCode: Number(process.env.VERSION_CODE),
              minSupportedVersionCode: Number(process.env.MIN_CODE || 10000),
              mandatory: process.env.MANDATORY === "true",
              publishedAt: process.env.PUBLISHED_AT,
              apkUrl: process.env.APK_URL,
              sha256: process.env.SHA256,
              sizeBytes: Number(process.env.SIZE_BYTES),
              releaseNotes: notes.length ? notes : ["Performans iyileştirmeleri ve hata düzeltmeleri."]
            };
            fs.writeFileSync("release-out/latest.json", JSON.stringify(manifest, null, 2) + "\n");
          ' APK_URL="$APK_URL" SHA256="$SHA256" SIZE_BYTES="$SIZE_BYTES" PUBLISHED_AT="$PUBLISHED_AT"

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          cat release-out/latest.json

      - name: Upload Play Store AAB to Private Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesai-v${{ steps.meta.outputs.version_name }}-play-aab
          path: android/app/build/outputs/bundle/playRelease/*.aab
          retention-days: 30

      - name: Publish Direct APK & latest.json to Public Repository (ipflixxx/mesai_releases)
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PUSH_TOKEN }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          APK_NAME: ${{ steps.pkg.outputs.apk_name }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "RELEASES_PUSH_TOKEN secret is not configured. Skipping push to ipflixxx/mesai_releases."
            exit 1
          fi

          gh release create "v${VERSION_NAME}" \
            "release-out/${APK_NAME}" \
            "release-out/${APK_NAME}.sha256" \
            --repo ipflixxx/mesai_releases \
            --title "MESAİ v${VERSION_NAME}" \
            --notes-file <(node -e 'const m=require("./release-out/latest.json"); console.log(m.releaseNotes.map(n=>"- "+n).join("\n"));') \
            || gh release upload "v${VERSION_NAME}" \
               "release-out/${APK_NAME}" \
               "release-out/${APK_NAME}.sha256" \
               --repo ipflixxx/mesai_releases --clobber

          git clone "https://x-access-token:${GH_TOKEN}@github.com/ipflixxx/mesai_releases.git" releases-repo
          cp release-out/latest.json releases-repo/latest.json
          cd releases-repo
          git config user.name "mesai-release-bot"
          git config user.email "release-bot@users.noreply.github.com"
          git add latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): publish v${VERSION_NAME}"
            git push origin main
          fi
